<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#1c2430"/>
  <g transform="translate(64 68)">
    <!-- dial arc -->
    <path d="M -38 6 A 38 38 0 1 1 38 6" fill="none" stroke="#3c4b5e" stroke-width="12" stroke-linecap="round"/>
    <!-- active arc -->
    <path d="M -38 6 A 38 38 0 0 1 14 -35" fill="none" stroke="#62a0ea" stroke-width="12" stroke-linecap="round"/>
    <!-- ticks -->
    <g stroke="#8ea1b8" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-30" x2="0" y2="-24"/>
      <line x1="21" y1="-21" x2="17" y2="-17"/>
      <line x1="30" y1="0" x2="24" y2="0"/>
      <line x1="-21" y1="-21" x2="-17" y2="-17"/>
      <line x1="-30" y1="0" x2="-24" y2="0"/>
    </g>
    <!-- needle -->
    <line x1="0" y1="0" x2="24" y2="-16" stroke="#f6f5f4" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="#f6f5f4"/>
    <circle cx="0" cy="0" r="4" fill="#62a0ea"/>
  </g>
  <!-- three small resource blocks under the dial -->
  <g fill="#62a0ea">
    <rect x="34" y="104" width="18" height="8" rx="4"/>
    <rect x="56" y="104" width="18" height="8" rx="4" opacity="0.66"/>
    <rect x="78" y="104" width="18" height="8" rx="4" opacity="0.33"/>
  </g>
</svg>
