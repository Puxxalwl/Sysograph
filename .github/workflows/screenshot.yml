name: Generate screenshot

# Creates a preview on a disposable GitHub-hosted runner. The image is never
# committed to the repository and therefore cannot contain a developer's data.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config libgtk-4-dev \
            xvfb xdotool imagemagick

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run Sysograph on an isolated display
        env:
          DISPLAY: :99
        run: |
          Xvfb :99 -screen 0 1440x900x24 -ac >/tmp/xvfb.log 2>&1 &
          echo $! >/tmp/xvfb.pid
          for attempt in $(seq 1 20); do
            xdpyinfo >/dev/null 2>&1 && break
            sleep 1
          done
          ./build/sysograph >/tmp/sysograph.log 2>&1 &
          echo $! >/tmp/sysograph.pid
          for attempt in $(seq 1 30); do
            WINDOW=$(xdotool search --name '^Sysograph$' 2>/dev/null | head -1 || true)
            test -n "$WINDOW" && break
            sleep 1
          done
          test -n "$WINDOW"
          # Xvfb has no window manager, so _NET_ACTIVE_WINDOW is unavailable.
          # Import the window directly instead of trying to activate it.
          sleep 3
          import -window "$WINDOW" -crop 1280x720+0+0 screenshot.png
          test -s screenshot.png

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysograph-ci-screenshot
          path: screenshot.png
          retention-days: 7

      - name: Stop display
        if: always()
        run: |
          test ! -f /tmp/sysograph.pid || kill "$(cat /tmp/sysograph.pid)" || true
          test ! -f /tmp/xvfb.pid || kill "$(cat /tmp/xvfb.pid)" || true
