name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  deb:
    name: Debian/Ubuntu (.deb)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libgtk-4-dev dpkg-dev ca-certificates git
      - name: Build, test and package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure
          cd build && cpack -G DEB
      - uses: actions/upload-artifact@v4
        with:
          name: sysograph-deb
          path: build/*.deb

  rpm:
    name: Fedora/RHEL (.rpm)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y git gcc-c++ cmake pkgconf-pkg-config gtk4-devel rpm-build
          command -v rpmbuild
      - name: Build, test and package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure
          cd build && cpack -G RPM
      - uses: actions/upload-artifact@v4
        with:
          name: sysograph-rpm
          path: build/*.rpm

  arch:
    name: Arch Linux (tar.gz)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: |
          pacman -Sy --noconfirm --needed base-devel cmake pkgconf gtk4 git
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure
          DESTDIR="$PWD/pkg" cmake --install build
          tar -C pkg -czf "sysograph-${GITHUB_REF_NAME#v}-arch-x86_64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: sysograph-arch
          path: '*.tar.gz'

  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-4-dev wget fuse
      - name: Build AppImage
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          DESTDIR=AppDir cmake --install build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/latest/download/linuxdeploy-plugin-gtk-x86_64.AppImage -O linuxdeploy-plugin-gtk
          chmod +x linuxdeploy linuxdeploy-plugin-gtk
          OUTPUT="Sysograph-${GITHUB_REF_NAME#v}-x86_64.AppImage" ./linuxdeploy --appdir AppDir --desktop-file packaging/org.sysograph.Sysograph.desktop --icon-file data/icons/org.sysograph.Sysograph.svg --plugin gtk --output appimage
      - uses: actions/upload-artifact@v4
        with:
          name: sysograph-appimage
          path: '*.AppImage'

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [deb, rpm, arch, appimage]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
